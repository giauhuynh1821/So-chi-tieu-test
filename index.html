<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ chi tiêu</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F9; --card:#FFFFFF; --ink:#172033; --muted:#667085; --line:#D5DAE3; --seg:#E4E8F0;
  --chi:#C2410C; --thu:#0369A1; --on-accent:#FFFFFF; --danger:#B42318;
}
:root[data-theme="dark"]{
  --bg:#0F141C; --card:#1A222E; --ink:#E8ECF3; --muted:#9AA4B5; --line:#2E3849; --seg:#232C3A;
  --chi:#FB923C; --thu:#38BDF8; --on-accent:#10161F; --danger:#F97066;
}
:root[data-type="chi"]{--accent:var(--chi)}
:root[data-type="thu"]{--accent:var(--thu)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;padding:16px 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{margin:0;font-size:22px;font-weight:700}
.pill{height:36px;padding:0 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:500}
input[type=date].pill{width:auto}
.seg{display:flex;padding:4px;background:var(--seg);border-radius:16px;gap:4px;margin-bottom:16px}
.seg button{flex:1;height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:15px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.seg.tabs button.on{background:var(--card);color:var(--ink)}
section{margin-bottom:16px}
.label{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.card{background:var(--card);border-radius:20px;padding:18px 20px}
.money{display:flex;align-items:baseline;gap:8px}
.money input{flex:1;min-width:0;border:0;background:transparent;font-size:44px;font-weight:700;color:var(--accent);padding:0;outline:none}
.money span{font-size:24px;font-weight:600;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{min-height:68px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;cursor:pointer}
.tile i{width:8px;height:8px;border-radius:4px;display:block}
.tile.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.field{width:100%;height:52px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:0 16px;font-size:15px;outline:none}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
footer .in{max-width:480px;margin:0 auto}
.save{width:100%;height:56px;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:700;cursor:pointer}
.save:disabled{opacity:.6}
.sum{display:flex;gap:12px;margin-bottom:16px}
.sum .card{flex:1;padding:14px 16px}
.sum b{display:block;font-size:20px;margin-top:4px}
.item{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item small{display:block;color:var(--muted);margin-top:2px;font-size:13px}
.amt{font-weight:700;white-space:nowrap}
.muted{color:var(--muted);font-size:14px}
.err{color:var(--danger);font-size:14px}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;z-index:10}
#toast.show{opacity:1}
.pendingbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;margin-bottom:16px;font-size:13px;color:var(--muted)}
.pendingbar button{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;cursor:pointer}
.hide{display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Sổ chi tiêu</h1>
    <input id="date" class="pill" type="date" aria-label="Ngày giao dịch">
  </header>

  <div id="pendingBar" class="pendingbar hide" role="status"></div>

  <div class="seg tabs" role="group" aria-label="Chuyển tab">
    <button type="button" class="on" data-tab="form">Ghi chép</button>
    <button type="button" data-tab="lookup">Tra cứu</button>
  </div>

  <!-- TAB GHI CHÉP -->
  <div id="view-form">
    <div class="seg" role="group" aria-label="Loại giao dịch">
      <button type="button" data-pick="type" data-v="Chi" class="on">Chi</button>
      <button type="button" data-pick="type" data-v="Thu">Thu</button>
    </div>

    <section><span class="label">Nguồn tiền</span><div id="srcBox" class="row"></div></section>
    <section><span class="label">Danh mục</span><div id="menuBox"><span class="muted">Đang tải danh mục...</span></div></section>
    <section id="subSec" class="hide"><span class="label">Mục con · theo danh mục đã chọn</span><div id="subBox" class="row"></div></section>
    <section id="peopleSec" class="hide"><span class="label">Chọn người (vay/nợ)</span><div id="peopleBox" class="row"></div></section>
    <section><label class="label" for="note">Ghi chú</label><input id="note" class="field" type="text" autocomplete="off"></section>
    <section class="card">
      <label class="label" for="money">Số tiền</label>
      <div class="money"><input id="money" type="text" inputmode="numeric" placeholder="0" autocomplete="off"><span>đ</span></div>
      <div class="row" style="margin-top:10px">
        <button type="button" class="chip" data-pick="quick" data-v="10000">+10.000</button>
        <button type="button" class="chip" data-pick="quick" data-v="50000">+50.000</button>
        <button type="button" class="chip" data-pick="quick" data-v="100000">+100.000</button>
      </div>
    </section>

  </div>

  <!-- TAB TRA CỨU -->
  <div id="view-lookup" class="hide">
    <div class="sum">
      <div class="card"><span class="label" style="margin:0">Chi</span><b id="sumChi" style="color:var(--chi)">0đ</b><span class="muted" id="cntChi"></span></div>
      <div class="card"><span class="label" style="margin:0">Thu</span><b id="sumThu" style="color:var(--thu)">0đ</b><span class="muted" id="cntThu"></span></div>
    </div>
    <div class="card" id="dayList"><span class="muted">Đang tải...</span></div>
  </div>
</div>

<footer id="saveBar"><div class="in"><button id="saveBtn" class="save" type="button">Lưu giao dịch</button></div></footer>
<div id="toast" role="status"></div>

<script>
/* ===== CẤU HÌNH: dán link Web App (kết thúc bằng /exec) vào đây ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbx7fhBzW_b-OYI4yM1KSLPmQh_BQtbNnnJiDXATviB_GfPovLb_GmqqMf404ysxFnqB/exec';
const SEP = '.';            // dấu phân cách hàng nghìn: '.' (khớp sheet) hoặc ','
const TZ = 'Asia/Ho_Chi_Minh';
const DOTS = ['#C2410C','#0369A1','#7C3AED','#0F766E','#B45309','#BE185D','#4D7C0F','#475467'];

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const root = document.documentElement;
const dark = tg ? tg.colorScheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
if (dark) root.dataset.theme = 'dark';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, SEP);
const todayStr = () => new Date().toLocaleDateString('en-CA', { timeZone: TZ });
const uniq = a => a.filter((v, i) => a.indexOf(v) === i);

const state = {
  type: 'Chi', source: '', menu: '', sub: '', amount: 0, date: todayStr(),
  categories: [], people: [], loaded: false,
};

/* ---------- GỌI API ---------- */
async function api(action, payload) {
  let data;
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // tránh lỗi CORS preflight
      body: JSON.stringify(Object.assign({ action, initData: tg ? tg.initData : '' }, payload || {})),
    });
    data = await res.json();
  } catch (e) {
    const er = new Error('Không kết nối được máy chủ');
    er.net = true;                                               // lỗi mạng: được phép gửi lại
    throw er;
  }
  if (!data.ok) throw new Error(data.error || 'Lỗi không xác định');
  return data;
}

let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function haptic(kind) { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(kind); }

/* ---------- LỌC DANH MỤC PHỤ THUỘC ---------- */
function rows() {
  const byType = state.categories.filter(r => !r.type || r.type.toLowerCase() === state.type.toLowerCase());
  return byType.length ? byType : state.categories;   // nếu sheet Danh mục không chia theo Chi/Thu
}
const sources = () => uniq(rows().map(r => r.source).filter(Boolean));
const menus = () => uniq(rows().filter(r => r.source === state.source).map(r => r.menu).filter(Boolean));
const subs = () => uniq(rows().filter(r => r.source === state.source && r.menu === state.menu).map(r => r.sub).filter(Boolean));

function fixSelection() {
  const s = sources();
  if (!s.includes(state.source)) state.source = s.includes('Mặc định') ? 'Mặc định' : (s[0] || '');
  if (!menus().includes(state.menu)) state.menu = '';
  if (!subs().includes(state.sub)) state.sub = '';
}

/* ---------- VẼ CÁC NHÓM LỰA CHỌN ---------- */
function renderChoices() {
  $('srcBox').innerHTML = sources().map(v =>
    `<button type="button" class="chip ${v === state.source ? 'on' : ''}" data-pick="source" data-v="${esc(v)}">${esc(v)}</button>`).join('')
    || '<span class="muted">Chưa có nguồn tiền</span>';

  const m = menus();
  $('menuBox').innerHTML = m.length ? `<div class="grid">${m.map((v, i) =>
    `<button type="button" class="tile ${v === state.menu ? 'on' : ''}" data-pick="menu" data-v="${esc(v)}"><i style="background:${DOTS[i % DOTS.length]}"></i>${esc(v)}</button>`).join('')}</div>`
    : '<span class="muted">Chọn nguồn tiền để xem danh mục</span>';

  const sb = subs();
  $('subSec').classList.toggle('hide', !sb.length);
  $('subBox').innerHTML = sb.map(v =>
    `<button type="button" class="chip ${v === state.sub ? 'on' : ''}" data-pick="sub" data-v="${esc(v)}">${esc(v)}</button>`).join('');

  const showPeople = /vay|nợ/i.test(state.menu) && state.people.length;
  $('peopleSec').classList.toggle('hide', !showPeople);
  $('peopleBox').innerHTML = showPeople ? state.people.map(v =>
    `<button type="button" class="chip" data-pick="person" data-v="${esc(v)}">${esc(v)}</button>`).join('') : '';
}

function syncType() {
  root.dataset.type = state.type.toLowerCase();
  document.querySelectorAll('[data-pick="type"]').forEach(b => b.classList.toggle('on', b.dataset.v === state.type));
}

/* ---------- SỰ KIỆN ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) return showTab(tab.dataset.tab);
  const b = e.target.closest('[data-pick]');
  if (!b) return;
  const k = b.dataset.pick, v = b.dataset.v;
  if (k === 'type') { state.type = v; fixSelection(); syncType(); renderChoices(); }
  else if (k === 'source') { state.source = v; state.menu = ''; state.sub = ''; renderChoices(); }
  else if (k === 'menu') { state.menu = v; state.sub = ''; renderChoices(); }
  else if (k === 'sub') { state.sub = state.sub === v ? '' : v; renderChoices(); }
  else if (k === 'person') { $('note').value = v; }
  else if (k === 'quick') { setAmount(state.amount + Number(v)); }
  else if (k === 'retry') { syncQueue(); }
});

function setAmount(n) { state.amount = n; $('money').value = n ? fmt(n) : ''; }
$('money').addEventListener('input', e => setAmount(Number(e.target.value.replace(/\D/g, '')) || 0));
$('date').addEventListener('change', e => { state.date = e.target.value || todayStr(); loadDay(); });
$('date').value = state.date;

function showTab(name) {
  $('view-form').classList.toggle('hide', name !== 'form');
  $('view-lookup').classList.toggle('hide', name !== 'lookup');
  $('saveBar').classList.toggle('hide', name !== 'form');
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  if (name === 'lookup') loadDay();
}

/* ---------- LƯU GIAO DỊCH: ghi trước, đồng bộ sau ---------- */
const QKEY = 'pending_v1';
const getQ = () => { try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch (e) { return []; } };
const setQ = q => { try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch (e) {} renderPending(); };
const newCid = () => Array.from(crypto.getRandomValues(new Uint8Array(4))).map(b => b.toString(16).padStart(2, '0')).join('');
let syncing = false;

function renderPending() {
  const n = getQ().length;
  const bar = $('pendingBar');
  bar.classList.toggle('hide', n === 0);
  bar.innerHTML = n ? `<span>${syncing ? '⏳ Đang đồng bộ' : '⚠️ Chưa đồng bộ'} ${n} giao dịch</span>` +
    (syncing ? '' : '<button type="button" data-pick="retry">Thử lại</button>') : '';
}

async function syncQueue() {
  if (syncing) return;
  syncing = true; renderPending();
  try {
    while (getQ().length) {
      const item = getQ()[0];
      try {
        await api('add', item);
        const q = getQ(); q.shift(); setQ(q);
      } catch (err) {
        if (err.net) break;                       // mất mạng: giữ lại, thử lại sau
        const q = getQ(); q.shift(); setQ(q);     // máy chủ từ chối: báo lý do rồi bỏ khỏi hàng chờ
        haptic('error');
        toast('Không lưu được ' + fmt(item.money) + 'đ: ' + err.message);
      }
    }
  } finally {
    syncing = false; renderPending();
    if (!$('view-lookup').classList.contains('hide')) loadDay();
  }
}

$('saveBtn').addEventListener('click', () => {
  if (!state.amount) return toast('Nhập số tiền trước nhé');
  if (!state.source) return toast('Chọn nguồn tiền');
  if (!state.menu) return toast('Chọn danh mục');
  const item = {
    cid: newCid(), type: state.type, date: state.date, source: state.source, menu: state.menu,
    sub: state.sub, note: $('note').value, money: state.amount,
  };
  const q = getQ(); q.push(item); setQ(q);          // lưu vào máy trước, không mất dù đóng app
  haptic('success');
  toast('Đã ghi ' + fmt(item.money) + 'đ');
  setAmount(0); $('note').value = ''; state.menu = ''; state.sub = ''; renderChoices();
  syncQueue();                                       // gửi lên sheet chạy ngầm
});

window.addEventListener('online', syncQueue);
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncQueue(); });

/* ---------- TRA CỨU THEO NGÀY ---------- */
async function loadDay() {
  $('dayList').innerHTML = '<span class="muted">Đang tải...</span>';
  try {
    const d = await api('day', { date: state.date });
    $('sumChi').textContent = fmt(d.totalChi) + 'đ'; $('cntChi').textContent = d.countChi + ' giao dịch';
    $('sumThu').textContent = fmt(d.totalThu) + 'đ'; $('cntThu').textContent = d.countThu + ' giao dịch';
    $('dayList').innerHTML = d.items.length ? d.items.map(it => `
      <div class="item">
        <div><div>${esc(it.menu)}${it.sub ? ' · ' + esc(it.sub) : ''}</div>
        <small>${esc(it.note || it.source)}</small></div>
        <div class="amt" style="color:var(--${it.type === 'Thu' ? 'thu' : 'chi'})">${it.type === 'Thu' ? '+' : '-'}${fmt(it.money)}đ</div>
      </div>`).join('') : '<span class="muted">Ngày này chưa có giao dịch nào.</span>';
  } catch (err) {
    $('dayList').innerHTML = '<span class="err">Lỗi: ' + esc(err.message) + '</span>';
  }
}

/* ---------- KHỞI ĐỘNG ---------- */
function applyMeta(m) {
  state.categories = m.categories; state.people = m.people; state.loaded = true;
  fixSelection(); renderChoices();
}

async function init() {
  syncType();
  renderPending();
  // Hiện ngay danh mục đã nhớ từ lần trước, rồi cập nhật ngầm
  try {
    const cached = JSON.parse(localStorage.getItem('meta_v1') || 'null');
    if (cached) applyMeta(cached);
  } catch (e) {}
  syncQueue();   // gửi nốt các giao dịch còn chờ từ lần trước
  try {
    const m = await api('meta');
    try { localStorage.setItem('meta_v1', JSON.stringify({ categories: m.categories, people: m.people })); } catch (e) {}
    applyMeta(m);
  } catch (err) {
    if (!state.loaded) $('menuBox').innerHTML = '<span class="err">Không tải được danh mục: ' + esc(err.message) + '</span>';
  }
}
init();
</script>

.tile i{width:8px;height:8px;border-radius:4px;display:block}
.tile.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.field{width:100%;height:52px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:0 16px;font-size:15px;outline:none}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
footer .in{max-width:480px;margin:0 auto}
.save{width:100%;height:56px;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:700;cursor:pointer}
.save:disabled{opacity:.6}
.sum{display:flex;gap:12px;margin-bottom:16px}
.sum .card{flex:1;padding:14px 16px}
.sum b{display:block;font-size:20px;margin-top:4px}
.item{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item small{display:block;color:var(--muted);margin-top:2px;font-size:13px}
.amt{font-weight:700;white-space:nowrap}
.muted{color:var(--muted);font-size:14px}
.err{color:var(--danger);font-size:14px}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;z-index:10}
#toast.show{opacity:1}
.pendingbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;margin-bottom:16px;font-size:13px;color:var(--muted)}
.pendingbar button{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;cursor:pointer}
.hide{display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Sổ chi tiêu</h1>
    <input id="date" class="pill" type="date" aria-label="Ngày giao dịch">
  </header>

  <div id="pendingBar" class="pendingbar hide" role="status"></div>

  <div class="seg tabs" role="group" aria-label="Chuyển tab">
    <button type="button" class="on" data-tab="form">Ghi chép</button>
    <button type="button" data-tab="lookup">Tra cứu</button>
  </div>

  <!-- TAB GHI CHÉP -->
  <div id="view-form">
    <div class="seg" role="group" aria-label="Loại giao dịch">
      <button type="button" data-pick="type" data-v="Chi" class="on">Chi</button>
      <button type="button" data-pick="type" data-v="Thu">Thu</button>
    </div>

    <section><span class="label">Nguồn tiền</span><div id="srcBox" class="row"></div></section>
    <section><span class="label">Danh mục</span><div id="menuBox"><span class="muted">Đang tải danh mục...</span></div></section>
    <section id="subSec" class="hide"><span class="label">Mục con · theo danh mục đã chọn</span><div id="subBox" class="row"></div></section>
    <section id="peopleSec" class="hide"><span class="label">Chọn người (vay/nợ)</span><div id="peopleBox" class="row"></div></section>
    <section><label class="label" for="note">Ghi chú</label><input id="note" class="field" type="text" autocomplete="off"></section>
    <section class="card">
      <label class="label" for="money">Số tiền</label>
      <div class="money"><input id="money" type="text" inputmode="numeric" placeholder="0" autocomplete="off"><span>đ</span></div>
      <div class="row" style="margin-top:10px">
        <button type="button" class="chip" data-pick="quick" data-v="10000">+10.000</button>
        <button type="button" class="chip" data-pick="quick" data-v="50000">+50.000</button>
        <button type="button" class="chip" data-pick="quick" data-v="100000">+100.000</button>
      </div>
    </section>

  </div>

  <!-- TAB TRA CỨU -->
  <div id="view-lookup" class="hide">
    <div class="sum">
      <div class="card"><span class="label" style="margin:0">Chi</span><b id="sumChi" style="color:var(--chi)">0đ</b><span class="muted" id="cntChi"></span></div>
      <div class="card"><span class="label" style="margin:0">Thu</span><b id="sumThu" style="color:var(--thu)">0đ</b><span class="muted" id="cntThu"></span></div>
    </div>
    <div class="card" id="dayList"><span class="muted">Đang tải...</span></div>
  </div>
</div>

<footer id="saveBar"><div class="in"><button id="saveBtn" class="save" type="button">Lưu giao dịch</button></div></footer>
<div id="toast" role="status"></div>

<script>
/* ===== CẤU HÌNH: dán link Web App (kết thúc bằng /exec) vào đây ===== */
const API_URL = 'DÁN_LINK_WEB_APP_VÀO_ĐÂY';
const SEP = '.';            // dấu phân cách hàng nghìn: '.' (khớp sheet) hoặc ','
const TZ = 'Asia/Ho_Chi_Minh';
const DOTS = ['#C2410C','#0369A1','#7C3AED','#0F766E','#B45309','#BE185D','#4D7C0F','#475467'];

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const root = document.documentElement;
const dark = tg ? tg.colorScheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
if (dark) root.dataset.theme = 'dark';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, SEP);
const todayStr = () => new Date().toLocaleDateString('en-CA', { timeZone: TZ });
const uniq = a => a.filter((v, i) => a.indexOf(v) === i);

const state = {
  type: 'Chi', source: '', menu: '', sub: '', amount: 0, date: todayStr(),
  categories: [], people: [], loaded: false,
};

/* ---------- GỌI API ---------- */
async function api(action, payload) {
  let data;
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // tránh lỗi CORS preflight
      body: JSON.stringify(Object.assign({ action, initData: tg ? tg.initData : '' }, payload || {})),
    });
    data = await res.json();
  } catch (e) {
    const er = new Error('Không kết nối được máy chủ');
    er.net = true;                                               // lỗi mạng: được phép gửi lại
    throw er;
  }
  if (!data.ok) throw new Error(data.error || 'Lỗi không xác định');
  return data;
}

let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function haptic(kind) { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(kind); }

/* ---------- LỌC DANH MỤC PHỤ THUỘC ---------- */
function rows() {
  const byType = state.categories.filter(r => !r.type || r.type.toLowerCase() === state.type.toLowerCase());
  return byType.length ? byType : state.categories;   // nếu sheet Danh mục không chia theo Chi/Thu
}
const sources = () => uniq(rows().map(r => r.source).filter(Boolean));
const menus = () => uniq(rows().filter(r => r.source === state.source).map(r => r.menu).filter(Boolean));
const subs = () => uniq(rows().filter(r => r.source === state.source && r.menu === state.menu).map(r => r.sub).filter(Boolean));

function fixSelection() {
  const s = sources();
  if (!s.includes(state.source)) state.source = s.includes('Mặc định') ? 'Mặc định' : (s[0] || '');
  if (!menus().includes(state.menu)) state.menu = '';
  if (!subs().includes(state.sub)) state.sub = '';
}

/* ---------- VẼ CÁC NHÓM LỰA CHỌN ---------- */
function renderChoices() {
  $('srcBox').innerHTML = sources().map(v =>
    `<button type="button" class="chip ${v === state.source ? 'on' : ''}" data-pick="source" data-v="${esc(v)}">${esc(v)}</button>`).join('')
    || '<span class="muted">Chưa có nguồn tiền</span>';

  const m = menus();
  $('menuBox').innerHTML = m.length ? `<div class="grid">${m.map((v, i) =>
    `<button type="button" class="tile ${v === state.menu ? 'on' : ''}" data-pick="menu" data-v="${esc(v)}"><i style="background:${DOTS[i % DOTS.length]}"></i>${esc(v)}</button>`).join('')}</div>`
    : '<span class="muted">Chọn nguồn tiền để xem danh mục</span>';

  const sb = subs();
  $('subSec').classList.toggle('hide', !sb.length);
  $('subBox').innerHTML = sb.map(v =>
    `<button type="button" class="chip ${v === state.sub ? 'on' : ''}" data-pick="sub" data-v="${esc(v)}">${esc(v)}</button>`).join('');

  const showPeople = /vay|nợ/i.test(state.menu) && state.people.length;
  $('peopleSec').classList.toggle('hide', !showPeople);
  $('peopleBox').innerHTML = showPeople ? state.people.map(v =>
    `<button type="button" class="chip" data-pick="person" data-v="${esc(v)}">${esc(v)}</button>`).join('') : '';
}

function syncType() {
  root.dataset.type = state.type.toLowerCase();
  document.querySelectorAll('[data-pick="type"]').forEach(b => b.classList.toggle('on', b.dataset.v === state.type));
}

/* ---------- SỰ KIỆN ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) return showTab(tab.dataset.tab);
  const b = e.target.closest('[data-pick]');
  if (!b) return;
  const k = b.dataset.pick, v = b.dataset.v;
  if (k === 'type') { state.type = v; fixSelection(); syncType(); renderChoices(); }
  else if (k === 'source') { state.source = v; state.menu = ''; state.sub = ''; renderChoices(); }
  else if (k === 'menu') { state.menu = v; state.sub = ''; renderChoices(); }
  else if (k === 'sub') { state.sub = state.sub === v ? '' : v; renderChoices(); }
  else if (k === 'person') { $('note').value = v; }
  else if (k === 'quick') { setAmount(state.amount + Number(v)); }
  else if (k === 'retry') { syncQueue(); }
});

function setAmount(n) { state.amount = n; $('money').value = n ? fmt(n) : ''; }
$('money').addEventListener('input', e => setAmount(Number(e.target.value.replace(/\D/g, '')) || 0));
$('date').addEventListener('change', e => { state.date = e.target.value || todayStr(); loadDay(); });
$('date').value = state.date;

function showTab(name) {
  $('view-form').classList.toggle('hide', name !== 'form');
  $('view-lookup').classList.toggle('hide', name !== 'lookup');
  $('saveBar').classList.toggle('hide', name !== 'form');
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  if (name === 'lookup') loadDay();
}

/* ---------- LƯU GIAO DỊCH: ghi trước, đồng bộ sau ---------- */
const QKEY = 'pending_v1';
const getQ = () => { try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch (e) { return []; } };
const setQ = q => { try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch (e) {} renderPending(); };
const newCid = () => Array.from(crypto.getRandomValues(new Uint8Array(4))).map(b => b.toString(16).padStart(2, '0')).join('');
let syncing = false;

function renderPending() {
  const n = getQ().length;
  const bar = $('pendingBar');
  bar.classList.toggle('hide', n === 0);
  bar.innerHTML = n ? `<span>${syncing ? '⏳ Đang đồng bộ' : '⚠️ Chưa đồng bộ'} ${n} giao dịch</span>` +
    (syncing ? '' : '<button type="button" data-pick="retry">Thử lại</button>') : '';
}

async function syncQueue() {
  if (syncing) return;
  syncing = true; renderPending();
  try {
    while (getQ().length) {
      const item = getQ()[0];
      try {
        await api('add', item);
        const q = getQ(); q.shift(); setQ(q);
      } catch (err) {
        if (err.net) break;                       // mất mạng: giữ lại, thử lại sau
        const q = getQ(); q.shift(); setQ(q);     // máy chủ từ chối: báo lý do rồi bỏ khỏi hàng chờ
        haptic('error');
        toast('Không lưu được ' + fmt(item.money) + 'đ: ' + err.message);
      }
    }
  } finally {
    syncing = false; renderPending();
    if (!$('view-lookup').classList.contains('hide')) loadDay();
  }
}

$('saveBtn').addEventListener('click', () => {
  if (!state.amount) return toast('Nhập số tiền trước nhé');
  if (!state.source) return toast('Chọn nguồn tiền');
  if (!state.menu) return toast('Chọn danh mục');
  const item = {
    cid: newCid(), type: state.type, date: state.date, source: state.source, menu: state.menu,
    sub: state.sub, note: $('note').value, money: state.amount,
  };
  const q = getQ(); q.push(item); setQ(q);          // lưu vào máy trước, không mất dù đóng app
  haptic('success');
  toast('Đã ghi ' + fmt(item.money) + 'đ');
  setAmount(0); $('note').value = ''; state.menu = ''; state.sub = ''; renderChoices();
  syncQueue();                                       // gửi lên sheet chạy ngầm
});

window.addEventListener('online', syncQueue);
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncQueue(); });

/* ---------- TRA CỨU THEO NGÀY ---------- */
async function loadDay() {
  $('dayList').innerHTML = '<span class="muted">Đang tải...</span>';
  try {
    const d = await api('day', { date: state.date });
    $('sumChi').textContent = fmt(d.totalChi) + 'đ'; $('cntChi').textContent = d.countChi + ' giao dịch';
    $('sumThu').textContent = fmt(d.totalThu) + 'đ'; $('cntThu').textContent = d.countThu + ' giao dịch';
    $('dayList').innerHTML = d.items.length ? d.items.map(it => `
      <div class="item">
        <div><div>${esc(it.menu)}${it.sub ? ' · ' + esc(it.sub) : ''}</div>
        <small>${esc(it.note || it.source)}</small></div>
        <div class="amt" style="color:var(--${it.type === 'Thu' ? 'thu' : 'chi'})">${it.type === 'Thu' ? '+' : '-'}${fmt(it.money)}đ</div>
      </div>`).join('') : '<span class="muted">Ngày này chưa có giao dịch nào.</span>';
  } catch (err) {
    $('dayList').innerHTML = '<span class="err">Lỗi: ' + esc(err.message) + '</span>';
  }
}

/* ---------- KHỞI ĐỘNG ---------- */
async function init() {
  syncType();
  try {
    const m = await api('meta');
    state.categories = m.categories; state.people = m.people; state.loaded = true;
    fixSelection(); renderChoices();
  } catch (err) {
    $('menuBox').innerHTML = '<span class="err">Không tải được danh mục: ' + esc(err.message) + '</span>';
  }
}
init();
</script>
</body>
</html>
